name: Build & push demo bundle
description: Builds the boilerplate and pushes it to an Embeddable workspace

inputs:
  node-version:
    required: true
  api-key:
    required: true
  email:
    required: true
  message:
    required: true
  config-patch:
    description: Shell command to adjust embeddable.config.ts before building
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - run: npm ci
      shell: bash

    - if: inputs.config-patch != ''
      run: ${{ inputs.config-patch }}
      shell: bash

    - run: npm run embeddable:build
      shell: bash

    - run: npm run embeddable:push -- --api-key "${{ inputs.api-key }}" --email "${{ inputs.email }}" --message "${{ inputs.message }}"
      shell: bash
